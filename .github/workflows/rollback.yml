name: rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy again.
        required: true
        type: string
      reason:
        description: Short reason for the rollback.
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Validate input
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required"
            exit 1
          fi

      - name: Trigger rollback webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured. Cannot trigger rollback."
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -d "{\"service\":\"backend\",\"image\":\"$IMAGE\",\"tag\":\"${{ inputs.image_tag }}\",\"environment\":\"production\",\"action\":\"rollback\",\"reason\":\"${{ inputs.reason }}\"}"

      - name: Publish rollback summary
        run: |
          echo "### Rollback requested" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored tag: ${{ inputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strategy: deploy an older image tag" >> "$GITHUB_STEP_SUMMARY"