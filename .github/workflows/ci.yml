name: SHRISTI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest 
    environment: Backend

    env:
      API_KEY: ${{vars.API_KEY}}
      JWT_SEC: ${{secrets.JWT_SECRET}}
   

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build

      - name: Use Secret
        run: echo "Key is $API_KEY"
      - run: echo "Key is $JWT_SEC"
        

  test:
    runs-on: ubuntu-latest
    needs: build  

    environment: Backend

    env:
      API_KEY: ${{vars.API_KEY}}
      JWT_SEC: ${{secrets.JWT_SECRET}}
   
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm test