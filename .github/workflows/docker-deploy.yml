name: docker-deploy


on: 
  push:
    branches: [main]  
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: '20'
           cache: npm

      - name: Install depedencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
        contents: read
        packages: write
    outputs:
        image_name: ${{ steps.image-vars.outputs.image_name }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image-vars
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'>> "$GITHUB_OUTPUT")" 

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registery: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-vars.outputs.image_name }}:latest ${{ env.REGISTRY }}/${{ steps.image-vars.outputs.image_name }}: ${{ env.IMAGE_TAG }}